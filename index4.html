<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <table width="50%" border="2">
<tr>
    <th colspan="2">Tabela de Pessoas</th>
</tr>

<tr>
    <th>Nome</th>
    <th>Idade</th>
</tr>

<tr>
    <td>João</td>
    <td>25</td>
</tr>

<tr>
    <td>Maria</td>
    <td>30</td>
</tr>

    </table>

</body>
</html>

<!-- <th> Cria título para a coluna
<tr> Cria uma linha
<td> Cria uma célula, ou seja, cria uma coluna. -->
