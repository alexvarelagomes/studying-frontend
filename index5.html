<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário de Cadastro</h1><br>
    
    <form action="index5.html" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha"><br><br>

        <label for="genero">Gênero:</label>

        <select id="genero" name="genero">
            <option value="masculino" selected>Selecione</option>   
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="outro">Outro</option>
        </select><br><br>

        <label for="linguagem">Escolha a linguagem de programação:</label><br>

        <input type="radio" id="python" name="linguagem" value="python">
        <label for="python">Python</label><br>
        <input type="radio" id="java" name="linguagem" value="java">
        <label for="java">Java</label><br>
        <input type="radio" id="javascript" name="linguagem" value="javascript">
        <label for="javascript">JavaScript</label><br>
        <input type="radio" id="csharp" name="linguagem" value="csharp">
        <label for="csharp">C#</label><br>
        <input type="radio" id="php" name="linguagem" value="php">
        <label for="php">PHP</label><br><br>

        <label for="interesses">Interesses:</label><br>

        <input type="checkbox" id="interesse1" name="interesses" value="Automação">
        <label for="interesse1">Automação</label><br>
        <input type="checkbox" id="interesse2" name="interesses" value="Desenvolvimento Web">
        <label for="interesse2">Desenvolvimento Web</label><br>
        <input type="checkbox" id="interesse3" name="interesses" value="Data Science">
        <label for="interesse3">Data Science</label><br><br>
        <label for="mensagem">Outras informações caso necessário:</label><br>
        <textarea id="mensagem" name="mensagem" rows="4" cols="50" placeholder="Digite sua mensagem aqui..."></textarea>
        
        <br><br>

        <input type="submit" value="Enviar">
    </form>
</body>
</html>
